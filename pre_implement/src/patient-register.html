<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Register BHYT mockup</title>
<link rel="stylesheet" href="style.css">
<style>
.f{border:1px solid var(--ov);border-radius:14px;height:52px;display:flex;align-items:center;padding:0 14px;margin-bottom:14px;position:relative;font-size:15px;background:#fff}
.f label{position:absolute;top:-8px;left:10px;background:var(--surface);padding:0 4px;font-size:12px;color:var(--muted)}
.f.ph{color:var(--muted)}
.f .ms{margin-left:auto;color:var(--muted)}
.f.grey{background:var(--sch);border-color:#0000;color:var(--text)}
.f.grey label{background:linear-gradient(var(--surface) 50%,var(--sch) 50%);color:#0007}
.help{font-size:12px;color:var(--muted);margin:-10px 4px 14px}
</style></head><body>
<script>
function form(bhyt, help){return `
<div class="phone"><div class="status"><span>9:41</span><span></span></div>
<div class="appbar p"><div class="ib"><span class="ms">arrow_back</span></div><h1>Đăng ký bệnh nhân</h1></div>
<div class="content" style="padding-top:20px">
<div class="f ph">Email</div><div class="f ph">Mật khẩu (≥ 6 ký tự)</div><div class="f">Dương Quân<label>Họ tên</label></div>
<div class="f">079203000111<label>Số CCCD</label></div><div class="help">Dùng để tra thẻ BHYT. Không sửa được sau khi đăng ký</div>
<div style="display:flex;gap:12px"><div class="f" style="flex:1">24<label>Tuổi</label></div><div class="f" style="flex:1">Nam<label>Giới tính</label><span class="ms">arrow_drop_down</span></div></div>
<div class="f">15/06/2002<label>Ngày sinh</label><span class="ms">calendar_today</span></div>
${bhyt}<div class="help">${help}</div>
<div class="f ph">Số điện thoại</div><div class="f ph">Địa chỉ</div>
<div class="btn fill" style="width:100%;justify-content:center;height:44px">Đăng ký</div>
</div></div>`}
document.write('<div>'+form('<div class="f grey">DN4********0001 · 80% · HSD 31/12/2030<label>Thẻ BHYT</label><span class="ms">health_and_safety</span></div>','Tự tra theo CCCD và ngày sinh, không sửa được')+'<div class="cap">Có thẻ: ô xám, chỉ đọc, mã đã che</div></div>');
document.write('<div>'+form('<div class="f grey" style="color:var(--muted)">Không tìm thấy thẻ BHYT<label>Thẻ BHYT</label><span class="ms">health_and_safety</span></div>','Tự tra theo CCCD và ngày sinh, không sửa được')+'<div class="cap">Không có thẻ / sai ngày sinh</div></div>');
document.write('<div>'+form('<div class="f grey">GD4********0004 · 80% · HSD 31/12/2025 <b style="color:var(--error);margin-left:8px;font-size:13px">đã hết hạn</b><label>Thẻ BHYT</label><span class="ms">health_and_safety</span></div>','Tự tra theo CCCD và ngày sinh, không sửa được')+'<div class="cap">Thẻ hết hạn</div></div>');
</script>
</body></html>
